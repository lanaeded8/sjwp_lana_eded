<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oblikovanje obruba tablice</title>
    <h1 style="text-align: center; color: #191970">Obrubi tablice</h1>
    <hr />
    <h2 style="text-align: center; color: #191970">Raspored dodatne nastave</h2>
    <style>
      a:link,
      a:visited {
        background-color: #462625;
        color: white;
        padding: 15px 25px;
        text-align: center;
        text-decoration: none;
        display: inline-block; /* flex/grid/inline-block */
      }
      a:hover,
      a:active {
        background-color: rgb(228, 170, 170);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        border: 10px solid #bd7e7e;
      }
      th,
      td,
      tr {
        border: 10px solid #db7474;
      }
    </style>
  </head>
  <body>
    <table style="margin: auto">
      <tr>
        <th></th>
        <th style="text-align: center">Hrvatski jezik</th>
        <th>Matematika</th>
        <th>Engleski jezik</th>
        <th>Njemački jezik</th>
      </tr>
      <tr>
        <th>Dan</th>
        <td>Ponedjeljak</td>
        <td>Utorak</td>
        <td>Srijeda</td>
        <td>Četvrtak</td>
      </tr>
      <tr>
        <th>Vrijeme</th>
        <td>13:10-14:00</td>
        <td>12:10-12:45</td>
        <td>14:00-14:45</td>
        <td>13:10-14:00</td>
      </tr>
      <tr>
        <th>Mjesto</th>
        <td>Učionica 9</td>
        <td>Učionica 1</td>
        <td>Učionica 7</td>
        <td>Učionica 6</td>
      </tr>
    </table>
    <a href="tablice3.html">sljedeća stranica</a>
  </body>
</html>
