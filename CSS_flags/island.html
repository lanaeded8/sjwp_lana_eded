<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .plava {
        width: 500px;
        height: 340px;
        background-color: rgb(42, 62, 117);
        position: relative;
      }
      .b1 {
        width: 90px;
        height: 340px;
        background-color: rgb(255, 255, 255);
        position: absolute;

        left: 140px;
      }
      .b2 {
        width: 500px;
        height: 80px;
        background-color: rgb(255, 255, 255);
        position: absolute;
        top: 140px;
      }
      .c1 {
        width: 500px;
        height: 45px;
        background-color: rgb(189, 0, 0);
        position: absolute;
        top: 160px;
      }
      .c2 {
        width: 40px;
        height: 340px;
        background-color: rgb(189, 0, 0);
        position: absolute;

        left: 165px;
      }
    </style>
  </head>
  <body>
    <div class="plava">
      <div class="b1"></div>
      <div class="b2"></div>
      <div class="c1"></div>
      <div class="c2"></div>
    </div>
  </body>
</html>
