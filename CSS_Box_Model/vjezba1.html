<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Box Model</title>
    <style>
      div {
        width: 300px;
        height: 300px;
        box-sizing: border-box; /*da zadrzim 300 puta 300 px*/
      }
      .prvi {
        background-color: rgb(65, 129, 126);
        /* debljina,tip bordera, */
        border: 2px solid black;
        padding: 50px 60px; /*50px je gore i dolje, a 60px je lijevo i desno*/
        margin: 0 auto;
      }
      .drugi {
        background-color: rgb(128, 156, 147);
        margin: 20px 10px 5px 2px;
        border-radius: 50%; /*zaobljeni rubovi, 50% je savrseni krug*/
        border: 3px solid rgb(26, 68, 55);
      }
    </style>
  </head>
  <body>
    <div class="prvi">
      <p>Ovo je prvi paragraf u prvom div elementu</p>
    </div>

    <div class="drugi"></div>
  </body>
</html>
