<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 300px;
        height: 300px;
      }
      .relative {
        background-color: rgb(68, 27, 27);
        position: relative;
      }
      .absolute {
        background-color: rgb(86, 139, 155);
        position: absolute;
        top: 50px; /* spusta se dolje */
        left: 50px;
        z-index: -1; /* plavi ide iza crvenog */
      }
    </style>
  </head>
  <body>
    <!--  relative/absolute/static/fixed -->
    <div class="relative">
      <div class="absolute"></div>
    </div>
  </body>
</html>
