<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h1>HTML forme</h1>
    <form action="#" method="get">
      <label for="name">Unesi ime:</label>
      <input
        type="text"
        id="name"
        placeholder="unesi ime..."
        size="15"
        maxlength="5"
        required
      />
      <!-- size je za duljinu imputa
       maxlenght za broj dozvoljenih znakova
       required za obavezna polja
       disabled ne moze upisivat-->
      <br />

      <label for="pass">Unesi lozinku</label>
      <input type="password" name="pass" id="pass" /> <br />

      <label for="mail">Unesi mail:</label>
      <input type="email" name="mail" id="mail" /> <br />

      <label for="date">Izaberi datum:</label>
      <input type="date" name="date" id="date" /> <br />

      <label for="color" name="color" id="color"></label>
      <input type="color" name="color" id="color" /> <br />

      <label for="file">Izaberi file:</label>
      <input type="file" name="file" id="file" /> <br />

      <label for="tel">Unesite broj telefona:</label> <br />
      <input type="tel" name="tel" id="tel" /> <br />
      <!--  jednostruki odabir -->
      <p>Odaberi najbolji klub:</p>
      <input type="radio" name="klub" id="real" />
      <label for="real">Real Madrid</label> <br />

      <input type="radio" name="klub" id="barca" />
      <label for="barca">Barcelona</label> <br />

      <input type="radio" name="klub" id="marsa" />
      <label for="marsa"></label>Marsonija<br />

      <!-- visestruki odabir -->
      <p>Odaberi najbolji klub</p>
      <input type="checkbox" name="klub1" id="real" />
      <label for="real">Real Madrid</label>

      <input type="checkbox" name="klub2" id="barca" />
      <label for="barca">Barcelona</label>

      <input type="checkbox" name="klub3" id="marsa" />
      <label for="marsa">Marsonija</label>
      <!--  ono zadnje -->
      <input type="submit" value="Pošalji" />
      <input type="reset" value="Obriši" />
    </form>
  </body>
</html>
